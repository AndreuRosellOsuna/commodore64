name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build C64Console.sln -c Release

      - name: Test
        run: dotnet test C64Console.sln -c Release --no-build

      - name: Package exe and installer
        shell: pwsh
        run: |
          $version = dotnet msbuild src/C64Console.App -getProperty:Version
          ./build/package.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: C64Console-win-x64
          path: publish/C64Console.exe

      - uses: actions/upload-artifact@v4
        with:
          name: C64Console-setup
          path: installer/output/*.exe
