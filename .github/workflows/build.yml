name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build C64Console.sln -c Release

      - name: Test
        run: dotnet test C64Console.sln -c Release --no-build

      - name: Publish single-file exe
        run: dotnet publish src/C64Console.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: C64Console-win-x64
          path: publish/C64Console.exe
